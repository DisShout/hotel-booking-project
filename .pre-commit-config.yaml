repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.12
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer          # убирает пустые строки в конце файлов
      - id: trailing-whitespace        # удаляет пробелы в конце строк
      - id: check-added-large-files    # предупреждает о коммите больших файлов
      - id: check-yaml                 # проверка валидности YAML
      - id: check-json                 # проверка валидности JSON
      - id: debug-statements           # не даёт коммитить print() / pdb
